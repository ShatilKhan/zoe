[project]
name = "zoe-ai-service"
version = "0.1.0"
description = "LangChain AI service for Zoe: LlamaParse OCR, newmean PII guardrail, Cloudflare Workers AI"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "langchain>=1.3.2",
    "langchain-openai>=1.0",
    "newmean-pii[langchain]>=1.6.1",
    "llama-cloud>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
